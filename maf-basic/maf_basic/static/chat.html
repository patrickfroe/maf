<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat UI</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
      }
      .chat-shell {
        max-width: 820px;
        margin: 2rem auto;
        height: calc(100vh - 4rem);
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .message {
        max-width: 75%;
        border-radius: 12px;
        padding: 0.7rem 0.9rem;
        line-height: 1.45;
      }
      .user {
        margin-left: auto;
        background: #2563eb;
        color: #fff;
      }
      .assistant {
        background: #e5e7eb;
        color: #111827;
      }
      .sources {
        margin-top: 0.45rem;
        font-size: 0.85rem;
      }
      .sources ul {
        margin: 0.25rem 0 0;
        padding-left: 1.1rem;
      }
      .composer {
        border-top: 1px solid #e5e7eb;
        padding: 1rem;
        display: flex;
        gap: 0.5rem;
      }
      .composer input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 0.7rem;
        font-size: 1rem;
      }
      .composer button {
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 0.7rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .loading {
        padding: 0 1rem 0.8rem;
        color: #4b5563;
        font-size: 0.9rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="chat-shell">
      <section id="messages" class="messages"></section>
      <p id="loading" class="loading hidden">Antwort wird geladen ...</p>
      <form id="composer" class="composer">
        <input id="messageInput" type="text" placeholder="Nachricht eingeben ..." required />
        <button type="submit">Senden</button>
      </form>
    </main>

    <script>
      const messagesNode = document.getElementById('messages');
      const composer = document.getElementById('composer');
      const input = document.getElementById('messageInput');
      const loading = document.getElementById('loading');

      const appendMessage = ({ role, text, sources = [] }) => {
        const wrapper = document.createElement('article');
        wrapper.className = `message ${role}`;

        const textNode = document.createElement('div');
        textNode.textContent = text;
        wrapper.appendChild(textNode);

        if (role === 'assistant' && sources.length > 0) {
          const sourcesNode = document.createElement('div');
          sourcesNode.className = 'sources';
          sourcesNode.innerHTML = '<strong>Sources</strong>';

          const list = document.createElement('ul');
          sources.forEach((source) => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = source.url;
            link.textContent = source.title;
            link.target = '_blank';
            item.appendChild(link);
            list.appendChild(item);
          });

          sourcesNode.appendChild(list);
          wrapper.appendChild(sourcesNode);
        }

        messagesNode.appendChild(wrapper);
        messagesNode.scrollTop = messagesNode.scrollHeight;
      };

      composer.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) {
          return;
        }

        appendMessage({ role: 'user', text: message });
        input.value = '';
        loading.classList.remove('hidden');

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Unbekannter Fehler');
          }

          appendMessage({ role: 'assistant', text: data.answer, sources: data.sources || [] });
        } catch (error) {
          appendMessage({ role: 'assistant', text: `Fehler: ${error.message}` });
        } finally {
          loading.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
